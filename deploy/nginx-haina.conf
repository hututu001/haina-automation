# 海纳百川控制台 · nginx HTTPS 反代配置片段
# 前提：控制台以 systemd 运行在本机 127.0.0.1:8787（deploy/haina-web.service）
#
# 安装：
#   1. 域名 DNS A 记录指向服务器 IP
#   2. 签证书（acme.sh 示例）：
#      acme.sh --issue -d haina.example.com --webroot /www/wwwroot/default
#      acme.sh --install-cert -d haina.example.com \
#        --key-file       /etc/nginx/ssl/haina.key \
#        --fullchain-file /etc/nginx/ssl/haina.crt \
#        --reloadcmd      "nginx -s reload"
#   3. 把本文件内容并入 nginx 配置（宝塔面板：网站 → 设置 → 配置文件；
#      纯 nginx：放入 /etc/nginx/conf.d/haina.conf），改两处 server_name 和证书路径
#   4. nginx -t && nginx -s reload
#
# 重要：控制台网页「设置」里必须勾选「信任反代 IP」，
#   否则 nginx 同机回源会被当成"本机访问"，跳过 token 校验！
#   （trust_proxy 开启后按 X-Real-IP 判定，nginx 每次都会覆盖该头，无法伪造）

server {
    listen 80;
    server_name haina.example.com;
    # 80 只留作 ACME 续期验证，其余一律跳 https
    location /.well-known/acme-challenge/ { root /www/wwwroot/default; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name haina.example.com;

    ssl_certificate     /etc/nginx/ssl/haina.crt;
    ssl_certificate_key /etc/nginx/ssl/haina.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 可选：只允许自己的 IP 访问，多一道保险（换成你的家宽/常用 IP）
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 两个头控制台都认：X-Real-IP 优先，其次 X-Forwarded-For 第一个值
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 长连接输出（任务日志轮询用）
        proxy_read_timeout 120s;
    }
}
